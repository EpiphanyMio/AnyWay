name: Migrate legacy releases to AnyWay

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate-releases.sh
      - .github/workflows/migrate-releases.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy and rename releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/migrate-releases.sh
