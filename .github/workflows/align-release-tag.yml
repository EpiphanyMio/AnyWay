name: Align AnyWay 0.1.0 source tag

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/align-release-tag.yml

jobs:
  align:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Point release tag at the build source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0" --jq '.object.sha')"
          test "$current" = 'aaf19ac3fc3108f61c14904a5414186c9a798a3b'
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.1.0" \
            -f sha='081b7133c0ed573a2547a8f08ccd4cf4b91c0034' \
            -F force=false --jq '.object.sha'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0" --jq '.object.sha')" = \
            '081b7133c0ed573a2547a8f08ccd4cf4b91c0034'
