plugins {
    id 'com.android.application'
}

def productVersion = new File(rootDir, '../../VERSION').text.trim()
def versionParts = productVersion.tokenize('.').collect { it.toInteger() }

android {
    namespace 'com.anyway.mac.mock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.anyway.mac.mock'
        minSdk 26
        targetSdk 35
        versionCode (versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2])
        versionName productVersion
    }
}
